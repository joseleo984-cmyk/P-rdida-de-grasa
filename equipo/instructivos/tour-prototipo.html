<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo del tour de bienvenida</title>
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#14201f;--mut:#51615f;--ac:#0f766e;--on:#fff;--soft:#d9ebe8;--bd:#c9d6d4}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17211f;--tx:#eaf2f1;--mut:#9fb2af;--ac:#2dd4bf;--on:#06201c;--soft:#1f3330;--bd:#2c3d3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:16px}
.note{font-size:14px;color:var(--mut);margin:0 0 12px}
.roles{display:flex;gap:8px;margin-bottom:12px}
.roles button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:600 16px inherit;cursor:pointer}
.roles button[aria-pressed=true]{border-color:var(--ac);background:var(--soft)}
.tour{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 12px #0002;min-height:540px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mut)}
.skip{background:none;border:0;color:var(--ac);font:600 16px inherit;min-height:48px;padding:0 4px;cursor:pointer}
.art{margin:12px 0;background:var(--soft);border-radius:16px;padding:16px;min-height:200px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.chip{background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--bd)}
.chip b{font-weight:700}.tag{font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ac)}
.red{background:#fde2e2;color:#a31515}.amb{background:#fdecc8;color:#7a4b00}.grn{background:#d4f1e0;color:#146c3a}
.hl{outline:3px solid var(--ac);outline-offset:2px}
h2{font-size:24px;line-height:1.2;margin:4px 0 6px}p.b{margin:0;color:var(--mut)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--ac)}
.nav{display:flex;gap:10px;margin-top:auto}.nav button{flex:1;min-height:52px;border-radius:14px;font:700 18px inherit;cursor:pointer;border:2px solid var(--ac)}
.prev{background:none;color:var(--ac)}.next{background:var(--ac);color:var(--on)}.prev[disabled]{opacity:.35;cursor:default}
.again{margin-top:14px;width:100%;min-height:48px;border-radius:12px;border:1px dashed var(--bd);background:none;color:var(--mut);font:16px inherit;cursor:pointer}
.tabbar{display:flex;justify-content:space-around;font-size:13px;color:var(--mut);margin-top:6px}
</style></head><body><div class="wrap">
<p class="note"><b>Prototipo para verificar</b> (no es la app). Pantallas fijas con ilustración, 5 pasos por rol. Toca «Siguiente», «Atrás» y «Saltar». Datos ficticios.</p>
<div class="roles" role="group" aria-label="Rol">
<button id="r-a" aria-pressed="true">Asesorado</button><button id="r-c" aria-pressed="false">Coach</button></div>
<div id="app"></div>
<button class="again" id="again" hidden>Ver el tour otra vez (Más → Ayuda)</button>
</div>
<script>
var T={a:[
{t:'Este es tu día',b:'Un toque ya cuenta. Todo se guarda solo.',art:'<div class="chip hl"><span>💧 Agua 3 / 8</span><b>+1 vaso</b></div><div class="chip"><span>🌙 Sueño</span><b>7–8 h</b></div><div class="chip"><span>Entrené</span><b>Toca al terminar</b></div>',tab:'Inicio'},
{t:'Anota tu comida',b:'Elige lo que comiste. Si fue igual que ayer, un toque.',art:'<div class="chip hl"><span>+ Comida</span></div><div class="chip"><span>Igual que ayer</span></div><div class="chip"><span>Comidas anotadas</span><b>3</b></div>',tab:'Comidas'},
{t:'Entrena y mídete',b:'Mira cómo se hace cada ejercicio. La medida es opcional y solo toca lo de hoy.',art:'<div class="chip"><span>Rutina de hoy · 6 ejercicios</span></div><div class="chip hl"><span>Ya entrené</span></div><div class="chip"><span>Medirme ›</span><span class="tag">Opcional</span></div>',tab:'Entrenar · Progreso'},
{t:'Tú decides qué ve tu coach',b:'Las casillas vienen vacías. Puedes cambiarlas cuando quieras.',art:'<div class="chip hl"><span>Peso y medidas</span><span class="tag">Compartido</span></div><div class="chip"><span>Comidas</span><span class="tag">Tú eliges</span></div><div class="chip"><span>Fotos</span><span class="tag">Apagado</span></div>',tab:'Más → Mi coach'},
{t:'¿Dudas? Aquí hay ayuda',b:'En Más → Ayuda encuentras respuestas y puedes escribir a soporte.',art:'<div class="chip hl"><span>Ayuda</span><b>›</b></div><div class="chip"><span>Escribir a soporte</span><b>3128876125</b></div><div class="chip"><span>Ver el tour otra vez</span><b>›</b></div>',tab:'Más'}],
c:[
{t:'Tu lista con semáforo',b:'Quien necesita atención va primero. Sin regaños: es para acompañar.',art:'<div class="chip hl"><span>Ana Demo</span><span class="tag red">▲ Atención</span></div><div class="chip"><span>Beto Demo</span><span class="tag amb">● Revisar</span></div><div class="chip"><span>Carla Demo</span><span class="tag grn">✓ Al día</span></div>',tab:'Asesorados'},
{t:'Invita por WhatsApp o QR',b:'Solo se envía un enlace. Nunca datos de salud.',art:'<div class="chip hl"><span>Invitar por WhatsApp</span><b>›</b></div><div class="chip"><span>Mostrar QR</span><b>›</b></div><div class="chip"><span>Código de respaldo</span><b>••••</b></div>',tab:'Invitar'},
{t:'La ficha y las reacciones',b:'Solo ves lo que cada persona autorizó. Reacciona con un toque.',art:'<div class="chip"><span>Resumen de la semana</span></div><div class="chip hl"><span>Reacción</span><b>Enviar</b></div><div class="chip"><span>Revisado ✓</span></div>',tab:'Ficha'},
{t:'Marca los pagos',b:'Tú cobras por tu lado y lo marcas aquí. Pagó = 30 días.',art:'<div class="chip hl"><span>Carla Demo</span><span class="tag grn">Pagó</span></div><div class="chip"><span>Diego Demo</span><span class="tag red">No pagó</span></div><div class="chip"><span>Resumen</span><b>1 sin pagar</b></div>',tab:'Asesorados'},
{t:'Rutinas y ayuda',b:'Crea una rutina, asígnala y publícala como rutina de hoy. ¿Dudas? Más → Ayuda.',art:'<div class="chip hl"><span>Mis rutinas</span><b>›</b></div><div class="chip"><span>Publicar como rutina de hoy</span></div><div class="chip"><span>Ayuda y soporte</span><b>3128876125</b></div>',tab:'Rutinas · Más'}]};
var role='a',i=0,app=document.getElementById('app'),again=document.getElementById('again');
function esc(s){return s}
function render(){var s=T[role],n=s.length,x=s[i];
app.innerHTML='<div class="tour" role="dialog" aria-label="Tour de bienvenida"><div class="top"><span>Paso '+(i+1)+' de '+n+'</span><button class="skip" id="sk">Saltar</button></div>'+
'<div class="art" aria-hidden="true">'+x.art+'<div class="tabbar"><span>📍 '+x.tab+'</span></div></div><h2>'+x.t+'</h2><p class="b">'+x.b+'</p>'+
'<div class="dots">'+s.map(function(_,k){return '<i class="'+(k===i?'on':'')+'"></i>'}).join('')+'</div>'+
'<div class="nav"><button class="prev" id="pv" '+(i?'':'disabled')+'>Atrás</button><button class="next" id="nx">'+(i===n-1?'Empezar':'Siguiente')+'</button></div></div>';
again.hidden=true;
document.getElementById('sk').onclick=done;document.getElementById('pv').onclick=function(){if(i){i--;render()}};
document.getElementById('nx').onclick=function(){if(i<n-1){i++;render()}else done()}}
function done(){app.innerHTML='<div class="tour" style="justify-content:center;text-align:center"><h2>Listo 🎉</h2><p class="b">Así se vería la app después del tour. Solo se muestra la primera vez.</p></div>';again.hidden=false}
again.onclick=function(){i=0;render()};
function set(r){role=r;i=0;document.getElementById('r-a').setAttribute('aria-pressed',r==='a');document.getElementById('r-c').setAttribute('aria-pressed',r==='c');render()}
document.getElementById('r-a').onclick=function(){set('a')};document.getElementById('r-c').onclick=function(){set('c')};render();
</script></body></html>
